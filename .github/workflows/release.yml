name: docker-release
on:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  docker-xpu:
    runs-on: ubuntu-latest
    environment:
      name: "release"
    steps:
    - uses: actions/checkout@v6
    - name: Get the version
      id: get_version
      run: echo ::set-output name=VERSION::$(echo $GITHUB_REF | cut -d / -f 3)
    - name: Change for main
      id: change_version
      run: if [ "${{ steps.get_version.outputs.VERSION }}" == "main" ]; then echo ::set-output name=VERSION::latest; else echo ::set-output name=VERSION::${{ steps.get_version.outputs.VERSION }}; fi
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    - name: Build and push Docker base image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          anarkiwi/pytorch-xpu:${{ steps.change_version.outputs.VERSION }}
          anarkiwi/pytorch-xpu:latest
        cache-from: type=gha
        # mode=min: see docker.yml -- mode=max blows GitHub's 10GB cache limit
        # caching the oneAPI builder stage's intermediate layers.
        cache-to: type=gha,mode=min
      if: github.repository == 'anarkiwi/xpu-pytorch' && github.event_name == 'push'

