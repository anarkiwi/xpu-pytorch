name: docker-test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docker-xpu-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: false
        tags: anarkiwi/pytorch-xpu
        cache-from: type=gha
        # mode=min caches only the final image layers. mode=max would also cache
        # every intermediate layer of the oneAPI builder stage (base image + the
        # multi-GB torch wheel layer), pushing the cache past GitHub's 10GB
        # per-repo limit -> eviction/thrash. This ~9GB image is too big for the
        # gha cache to hold the build stages anyway.
        cache-to: type=gha,mode=min
